# Intent Taxonomy v4.0
# Two-level classification for dental clinic AI router
#
# L1: Routing level (5 classes) - determines production node
# L2: Subtype level (24 classes) - detailed analytics and prompt selection
#
# v4.0 changes:
# - negative_feedback → feedback (with positive/negative subtypes)
# - L2 classes: 20 → 24 (8 feedback subtypes)
# - Updated confidence thresholds: 0.90/0.70/0.50

taxonomy:
  version: "4.0"
  description: "Двухуровневая классификация сообщений пациентов стоматологической клиники"

  # =============================================================================
  # Level 1: Routing Classes (5)
  # =============================================================================
  level1:
    anamnesis:
      id: 0
      description: "Сбор анамнеза и информации о пациенте"
      description_en: "Medical history and patient information collection"
      production_node: "anamnesis_node"
      priority: "high"
      subtypes:
        symptom:
          id: 0
          description: "Симптомы, боль, дискомфорт"
          examples:
            - "Болит зуб"
            - "Кровоточат дёсны"
            - "Ноет челюсть"
            - "Чувствую пульсацию"
          keywords:
            - "болит"
            - "боль"
            - "ноет"
            - "пульсирует"
            - "кровоточит"
            - "чувствительность"
            - "реагирует"
        complaint:
          id: 1
          description: "Описание проблемы (не симптом)"
          examples:
            - "Выпала пломба"
            - "Откололся зуб"
            - "Сломался протез"
            - "Коронка шатается"
          keywords:
            - "выпала"
            - "откололся"
            - "сломался"
            - "треснул"
            - "шатается"
            - "отклеилась"
        services:
          id: 2
          description: "Интерес к услугам и процедурам"
          examples:
            - "Хочу отбеливание"
            - "Интересует имплантация"
            - "Нужны виниры"
            - "Хочу выровнять зубы"
          keywords:
            - "хочу"
            - "интересует"
            - "нужно"
            - "планирую"
            - "собираюсь"

    booking:
      id: 1
      description: "Запись на приём"
      description_en: "Appointment booking"
      production_node: "booking_node"
      priority: "medium"
      subtypes:
        new_appointment:
          id: 3
          description: "Новая запись на приём"
          examples:
            - "Хочу записаться на приём"
            - "Запишите меня к терапевту"
            - "Есть свободное время?"
            - "Когда можно прийти?"
          keywords:
            - "записаться"
            - "запишите"
            - "запись"
            - "приём"
            - "свободное время"
            - "окошко"
        reschedule:
          id: 4
          description: "Перенос записи"
          examples:
            - "Хочу перенести запись"
            - "Можно на другой день?"
            - "Перезапишите на завтра"
            - "Нужно изменить время"
          keywords:
            - "перенести"
            - "перезаписать"
            - "изменить время"
            - "другой день"
            - "сдвинуть"
        cancel:
          id: 5
          description: "Отмена записи"
          examples:
            - "Отмените запись"
            - "Не приду"
            - "Хочу отменить"
            - "Отмена приёма"
          keywords:
            - "отменить"
            - "отмена"
            - "не приду"
            - "не смогу прийти"

    faq:
      id: 2
      description: "Вопросы и информация"
      description_en: "FAQ and information requests"
      production_node: "faq_node"
      priority: "medium"
      subtypes:
        price:
          id: 6
          description: "Вопросы о ценах и стоимости"
          examples:
            - "Сколько стоит?"
            - "Какая цена?"
            - "Почём чистка?"
            - "Есть ли рассрочка?"
          keywords:
            - "сколько стоит"
            - "цена"
            - "стоимость"
            - "почём"
            - "прайс"
            - "рассрочка"
            - "скидка"
          focus: "cost"
        clinic_info:
          id: 7
          description: "Информация о клинике (адрес, часы работы, оборудование)"
          examples:
            - "Где вы находитесь?"
            - "До скольки работаете?"
            - "Работаете в субботу?"
            - "Есть ли парковка?"
          keywords:
            - "где"
            - "адрес"
            - "как добраться"
            - "работаете"
            - "часы работы"
            - "парковка"
        procedure:
          id: 8
          description: "Вопросы о процедурах (как проходит, больно ли)"
          examples:
            - "Как проходит лечение?"
            - "Это больно?"
            - "Какие риски?"
            - "Сколько времени займёт?"
          keywords:
            - "как проходит"
            - "больно"
            - "риски"
            - "сколько длится"
            - "как делают"
          focus: "process"
        visit_prep:
          id: 9
          description: "Рекомендации до/после визита"
          examples:
            - "Как подготовиться?"
            - "Что нельзя после лечения?"
            - "Можно ли есть?"
            - "Какие ограничения?"
          keywords:
            - "подготовиться"
            - "что нельзя"
            - "после лечения"
            - "ограничения"
            - "рекомендации"
        followup:
          id: 10
          description: "Уточняющие вопросы по текущему разговору"
          examples:
            - "А если не поможет?"
            - "Есть ли альтернативы?"
            - "А что лучше?"
            - "Подскажите подробнее"
          keywords:
            - "а если"
            - "а что"
            - "альтернатива"
            - "подробнее"
            - "уточните"

    feedback:
      id: 3
      description: "Отзывы о работе клиники (позитивные и негативные)"
      description_en: "Feedback about clinic services (positive and negative)"
      production_node: "feedback_node"
      priority: "high"
      subtypes:
        # Negative feedback (4 subtypes) - высокий приоритет, escalation
        negative_service:
          id: 11
          description: "Жалобы на сервис (ожидание, связь)"
          sentiment: "negative"
          escalation_required: true
          examples:
            - "Долго ждал в очереди"
            - "Мне не перезвонили"
            - "Не смог дозвониться"
            - "Запись потеряли"
          keywords:
            - "ждал"
            - "не перезвонили"
            - "не дозвониться"
            - "потеряли"
            - "опоздание"
        negative_quality:
          id: 12
          description: "Жалобы на качество лечения"
          sentiment: "negative"
          escalation_required: true
          examples:
            - "После лечения стало хуже"
            - "Пломба выпала через неделю"
            - "Боль не прошла"
            - "Коронка не подошла"
          keywords:
            - "стало хуже"
            - "выпала через"
            - "не помогло"
            - "снова болит"
            - "переделать"
        negative_staff:
          id: 13
          description: "Жалобы на персонал"
          sentiment: "negative"
          escalation_required: true
          examples:
            - "Врач был груб"
            - "Невежливое обслуживание"
            - "Администратор нахамил"
            - "Врач опоздал"
          keywords:
            - "груб"
            - "невежливо"
            - "нахамил"
            - "непрофессионально"
            - "опоздал"
        negative_general:
          id: 14
          description: "Общие претензии"
          sentiment: "negative"
          escalation_required: true
          examples:
            - "Недоволен обслуживанием"
            - "Хочу оставить жалобу"
            - "Это возмутительно"
            - "Хочу поговорить с руководством"
          keywords:
            - "недоволен"
            - "жалоба"
            - "возмутительно"
            - "руководство"
            - "претензия"
        # Positive feedback (4 subtypes) - v4.0 NEW
        positive_service:
          id: 20
          description: "Благодарность за сервис (быстрая работа, связь)"
          sentiment: "positive"
          examples:
            - "Быстро записали, спасибо"
            - "Сразу перезвонили"
            - "Отличная организация работы"
            - "Администратор очень помог"
            - "Записали на удобное время"
          keywords:
            - "быстро записали"
            - "сразу перезвонили"
            - "отличная организация"
            - "удобно записаться"
            - "напомнили"
        positive_quality:
          id: 21
          description: "Благодарность за качество лечения"
          sentiment: "positive"
          examples:
            - "Отличный результат лечения"
            - "Зуб больше не болит, спасибо"
            - "Всё сделали качественно"
            - "Пломба стоит уже год, отлично"
            - "Результат превзошёл ожидания"
          keywords:
            - "отличный результат"
            - "качественно"
            - "превзошёл ожидания"
            - "прекрасно сделали"
            - "больше не болит"
        positive_staff:
          id: 22
          description: "Благодарность персоналу"
          sentiment: "positive"
          examples:
            - "Врач очень внимательный"
            - "Персонал вежливый и приятный"
            - "Доктор настоящий профессионал"
            - "Ассистент была очень заботливая"
            - "Все объяснили понятно"
          keywords:
            - "внимательный"
            - "вежливый"
            - "профессионал"
            - "заботливый"
            - "понятно объяснил"
        positive_general:
          id: 23
          description: "Общая благодарность и рекомендации"
          sentiment: "positive"
          examples:
            - "Очень доволен клиникой"
            - "Рекомендую всем знакомым"
            - "Лучшая стоматология в городе"
            - "Спасибо за отличную работу"
            - "Буду обращаться только к вам"
          keywords:
            - "доволен"
            - "рекомендую"
            - "лучшая"
            - "отличная работа"
            - "буду обращаться"

    conversational:
      id: 4
      description: "Диалоговые сообщения"
      description_en: "Conversational messages"
      production_node: "continue_current"
      priority: "low"
      subtypes:
        greeting:
          id: 15
          description: "Приветствия"
          examples:
            - "Здравствуйте"
            - "Добрый день"
            - "Привет"
            - "Доброе утро"
          keywords:
            - "здравствуйте"
            - "добрый день"
            - "привет"
            - "доброе утро"
            - "добрый вечер"
        gratitude:
          id: 16
          description: "Благодарности"
          examples:
            - "Спасибо"
            - "Благодарю"
            - "Спасибо большое"
            - "Спасибо за помощь"
          keywords:
            - "спасибо"
            - "благодарю"
            - "благодарность"
        confirmation:
          id: 17
          description: "Подтверждения и согласия"
          examples:
            - "Хорошо"
            - "Понял"
            - "Ок"
            - "Договорились"
          keywords:
            - "хорошо"
            - "понял"
            - "ок"
            - "да"
            - "согласен"
            - "ладно"
        farewell:
          id: 18
          description: "Прощания"
          examples:
            - "До свидания"
            - "Пока"
            - "Всего доброго"
            - "До встречи"
          keywords:
            - "до свидания"
            - "пока"
            - "всего доброго"
            - "до встречи"
        unclear:
          id: 19
          description: "Неопределённые ответы"
          examples:
            - "Не знаю"
            - "Подумаю"
            - "Пока не решил"
            - "Надо посоветоваться"
          keywords:
            - "не знаю"
            - "подумаю"
            - "не решил"
            - "посоветуюсь"

  # =============================================================================
  # Entity Types for Extraction
  # =============================================================================
  entity_types:
    doctor:
      description: "Имя или фамилия врача"
      patterns:
        - "(?:у|к)\\s+(\\w+ов[аы]?|\\w+ев[аы]?|\\w+ин[аы]?)"
        - "(?:доктор|врач|стоматолог)\\s+(\\w+)"
      examples:
        - "Иванов"
        - "доктор Петрова"
        - "у Сидорова"
    
    date:
      description: "Дата или день"
      patterns:
        - "(сегодня|завтра|послезавтра|вчера)"
        - "(понедельник|вторник|среда|четверг|пятница|суббота|воскресенье)"
        - "(\\d{1,2}\\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря))"
        - "(на (?:этой|следующей|прошлой) неделе)"
      examples:
        - "завтра"
        - "в понедельник"
        - "15 января"
    
    time:
      description: "Время приёма"
      patterns:
        - "(\\d{1,2}[:\\.]?\\d{0,2})"
        - "(утром|днём|вечером|после обеда)"
      examples:
        - "в 10:00"
        - "утром"
        - "после обеда"
    
    procedure:
      description: "Название процедуры"
      vocabulary:
        - "лечение кариеса"
        - "пломбирование"
        - "удаление"
        - "имплантация"
        - "отбеливание"
        - "чистка"
        - "протезирование"
        - "коронка"
        - "виниры"
        - "брекеты"
        - "элайнеры"
      examples:
        - "отбеливание"
        - "имплантация"
        - "чистку"
    
    tooth:
      description: "Зуб или область"
      patterns:
        - "(\\d{1,2})\\s*(?:зуб|й)"
        - "(передн(?:ий|ие)|задн(?:ий|ие)|коренн(?:ой|ые)|зуб мудрости)"
        - "(верхн(?:ий|яя)|нижн(?:ий|яя))\\s*(?:зуб|челюсть|десна)"
        - "(единичка|двойка|тройка|четвёрка|пятёрка|шестёрка|семёрка|восьмёрка)"
      examples:
        - "шестёрка"
        - "передний зуб"
        - "верхняя челюсть"
    
    amount:
      description: "Сумма денег"
      patterns:
        - "(\\d+(?:\\s*\\d{3})*)\\s*(?:рублей|руб|р)"
        - "(\\d+)\\s*(?:тысяч[аи]?|тыс)"
      examples:
        - "5000 рублей"
        - "десять тысяч"
    
    duration:
      description: "Длительность"
      patterns:
        - "(\\d+)\\s*(?:день|дня|дней|неделю|недели|месяц|месяца)"
        - "(уже|уже\\s+)?(давно|недавно)"
        - "(с\\s+(?:утра|вчера|позавчера))"
      examples:
        - "уже неделю"
        - "третий день"
        - "с утра"

  # =============================================================================
  # Modifiers (Affect Classification)
  # =============================================================================
  modifiers:
    negation:
      description: "Отрицание"
      keywords:
        - "не"
        - "нет"
        - "без"
        - "никак"
        - "ни за что"
      effect: "может изменить intent"
    
    doubt:
      description: "Сомнение"
      keywords:
        - "точно"
        - "правда"
        - "а если"
        - "вдруг"
        - "наверное"
      effect: "понижает confidence"
    
    urgency:
      description: "Срочность"
      keywords:
        - "срочно"
        - "быстро"
        - "немедленно"
        - "сейчас"
        - "сегодня"
      effect: "повышает priority"
    
    emotion_negative:
      description: "Негативная эмоция"
      keywords:
        - "опять"
        - "снова"
        - "уже"
        - "ещё"
        - "надоело"
      effect: "может указывать на feedback (negative)"
    
    sarcasm:
      description: "Сарказм"
      keywords:
        - "ну и"
        - "отлично"
        - "замечательно"
        - "прекрасно"
        - "супер"
      context_dependent: true
      effect: "может инвертировать sentiment"

  # =============================================================================
  # Tones (Sentiment/Emotion)
  # =============================================================================
  tones:
    neutral:
      description: "Нейтральный тон"
      weight: 1.0
    
    worried:
      description: "Обеспокоенный, тревожный"
      keywords:
        - "боюсь"
        - "переживаю"
        - "страшно"
        - "волнуюсь"
      weight: 1.1
    
    angry:
      description: "Раздражённый, злой"
      keywords:
        - "возмутительно"
        - "безобразие"
        - "недопустимо"
        - "ужас"
      weight: 1.3
      escalation_hint: true
    
    sarcastic:
      description: "Саркастический"
      requires_context: true
      weight: 1.2
    
    grateful:
      description: "Благодарный"
      keywords:
        - "очень благодарен"
        - "спасибо огромное"
      weight: 0.9
    
    urgent:
      description: "Срочный, экстренный"
      keywords:
        - "помогите"
        - "срочно"
        - "не могу терпеть"
        - "сильная боль"
      weight: 1.4
      priority_boost: true

  # =============================================================================
  # Confidence Thresholds (v4.0 updated)
  # =============================================================================
  confidence_thresholds:
    high: 0.90    # v4.0: было 0.85
    medium: 0.70  # v4.0: было 0.65
    low: 0.50     # v4.0: было 0.40
    
  routing_rules:
    high_confidence:
      threshold: 0.90
      action: "direct_route"
      description: "Прямая маршрутизация без уточнений"
    
    medium_confidence:
      threshold: 0.70
      action: "clarify"
      description: "Уточняющий вопрос при сомнении"
    
    low_confidence:
      threshold: 0.50
      action: "llm_fallback"
      description: "Сложные случаи → LLM для анализа"

  # =============================================================================
  # Class Weights for Training (v4.0 updated)
  # =============================================================================
  class_weights:
    l1:
      anamnesis: 1.0
      booking: 1.0
      faq: 1.0
      feedback: 1.5  # v4.0: важно, но не критично как было negative_feedback
      conversational: 0.8
    
    l2_priority:
      # Negative feedback - высокий приоритет (не пропустить жалобы!)
      negative_service: 2.0
      negative_quality: 2.0
      negative_staff: 2.0
      negative_general: 1.8
      # Positive feedback - средний приоритет
      positive_service: 1.2
      positive_quality: 1.2
      positive_staff: 1.2
      positive_general: 1.0
      # Important classes
      symptom: 1.2
      # остальные: 1.0

  # =============================================================================
  # Mappings (v4.0 updated)
  # =============================================================================
  l2_to_l1:
    symptom: "anamnesis"
    complaint: "anamnesis"
    services: "anamnesis"
    new_appointment: "booking"
    reschedule: "booking"
    cancel: "booking"
    price: "faq"
    clinic_info: "faq"
    procedure: "faq"
    visit_prep: "faq"
    followup: "faq"
    # Feedback - Negative
    negative_service: "feedback"
    negative_quality: "feedback"
    negative_staff: "feedback"
    negative_general: "feedback"
    # Feedback - Positive (v4.0 NEW)
    positive_service: "feedback"
    positive_quality: "feedback"
    positive_staff: "feedback"
    positive_general: "feedback"
    # Conversational
    greeting: "conversational"
    gratitude: "conversational"
    confirmation: "conversational"
    farewell: "conversational"
    unclear: "conversational"
  
  l1_to_production_node:
    anamnesis: "anamnesis_node"
    booking: "booking_node"
    faq: "faq_node"
    feedback: "feedback_node"  # v4.0: было escalation_node
    conversational: "continue_current"

# =============================================================================
# Dataset Configuration (v4.0 updated)
# =============================================================================
dataset:
  target_size: 12000  # v4.0: было 10000
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
  
  distribution_l1:
    anamnesis: 0.15      # 1,800
    booking: 0.15        # 1,800
    faq: 0.22            # 2,640
    feedback: 0.25       # 3,000 (50% negative, 50% positive)
    conversational: 0.23 # 2,760
  
  feedback_distribution:  # v4.0 NEW
    negative: 0.50  # 50% жалобы
    positive: 0.50  # 50% благодарности
  
  complexity_distribution:
    simple: 0.40
    medium: 0.30
    complex: 0.20
    edge_case: 0.10
  
  source_distribution:
    base_template: 0.10
    parametric: 0.20
    augmented: 0.40
    composite: 0.20
    llm_generated: 0.10
