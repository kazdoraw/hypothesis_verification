[pytest]
# Маркеры, используемые в d1/tests/*.
# Регистрация подавляет PytestUnknownMarkWarning и документирует contract.
markers =
    integration: тест с реальными моделями/данными (TrainedBundle, full dataset). Медленнее unit'ов.
    slow: тест требующий обучения/прогона на реальных данных (>5s).
