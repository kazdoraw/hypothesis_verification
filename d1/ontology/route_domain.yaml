# Онтология маршрутизации D1 v6 — SSoT (Single Source of Truth)
#
# Задача: классификация сообщения пациента → production граф-нода
# Соответствие: RouterPlan (ai-core/apps/agent-llm/core/schemas.py)
# 4 домена = 4 production-ноды: anamnesis_node, faq_node, booking_node, __end__

version: "6.0"
task: domain_routing
description: "Маршрутизация сообщения пациента в граф-ноду production системы"

domains:
  anamnesis:
    production_node: anamnesis_node
    description: "Жалобы, симптомы, запрос услуг/лечения, описание состояния"
    subtypes:
      symptom:
        description: "Боль, дискомфорт, физические ощущения"
        examples:
          - "Болит зуб"
          - "Десна кровоточит"
          - "Ноет под коронкой"
          - "Чувствительность на холодное"
          - "Опухла щека"
      complaint:
        description: "Описание проблемы (поломка, выпадение, разрушение)"
        examples:
          - "Выпала пломба"
          - "Откололся кусок зуба"
          - "Коронка шатается"
          - "Треснул зуб"
          - "Брекет отклеился"
      treatment_interest:
        description: "Интерес к услуге/процедуре без активной жалобы"
        examples:
          - "Хочу отбеливание"
          - "Интересует имплантация"
          - "Нужны брекеты"
          - "Хочу виниры"
          - "Нужна профессиональная чистка"

  faq:
    production_node: faq_node
    description: "Информационные вопросы о клинике, ценах, врачах, процедурах"
    subtypes:
      price:
        description: "Вопросы о стоимости услуг"
        examples:
          - "Сколько стоит имплант?"
          - "Какие цены на чистку?"
          - "Стоимость брекетов"
          - "Прайс на виниры"
          - "Есть ли рассрочка на имплантацию?"
      clinic_info:
        description: "Адрес, график, парковка, оплата, документы"
        examples:
          - "Где вы находитесь?"
          - "Работаете в субботу?"
          - "Есть рассрочка?"
          - "Какие формы оплаты принимаете?"
          - "Есть парковка?"
      doctor_info:
        description: "Вопросы о конкретных врачах, специалистах"
        examples:
          - "Работает ли у вас Батылин?"
          - "Кто ваш лучший ортодонт?"
          - "Какой стаж у хирурга?"
          - "Есть детский стоматолог?"
          - "Кто делает имплантацию?"
      procedure_info:
        description: "Как проходит процедура, длительность, болезненность, ограничения"
        examples:
          - "Имплантация это больно?"
          - "Сколько длится чистка?"
          - "Какие противопоказания у отбеливания?"
          - "Как проходит удаление зуба мудрости?"
          - "Через сколько можно есть после пломбы?"

  booking:
    production_node: booking_node
    description: "Явная запись на приём, перенос или отмена"
    subtypes:
      new_appointment:
        description: "Запрос на новую запись к врачу"
        examples:
          - "Хочу записаться"
          - "Когда можно попасть на приём?"
          - "Запишите на следующую неделю"
          - "Есть свободное время на завтра?"
          - "Хочу на консультацию"
      reschedule:
        description: "Перенос существующей записи"
        examples:
          - "Перенесите на четверг"
          - "Можно в другое время?"
          - "Хочу перенести запись"
          - "Не могу в понедельник, давайте во вторник"
          - "Перезапишите на утро"
      cancel:
        description: "Отмена записи"
        examples:
          - "Отмените запись"
          - "Не приду завтра"
          - "Хочу отменить приём"
          - "Отказываюсь от записи"
          - "Снимите меня с записи"

  unsupported:
    production_node: __end__
    description: "Не поддерживается: offtopic, greeting-only, farewell-only, unclear, feedback"
    subtypes:
      offtopic:
        description: "Вне тематики клиники"
        examples:
          - "Какая погода?"
          - "Расскажи анекдот"
          - "Кто президент?"
          - "Закажи мне пиццу"
          - "Переведи на английский"
      greeting_only:
        description: "Приветствие без интента (одно слово/фраза)"
        examples:
          - "Привет"
          - "Добрый день"
          - "Здравствуйте"
          - "Доброе утро"
          - "Алло"
      farewell_only:
        description: "Прощание без интента"
        examples:
          - "Пока"
          - "До свидания"
          - "Всего доброго"
          - "Спасибо, до встречи"
          - "Удачи"
      unclear_short:
        description: "Слишком короткое или неопределённое сообщение"
        examples:
          - "Ааа"
          - "Ну"
          - "Ок"
          - "..."
          - "Хм"
      feedback:
        description: "Отзыв/жалоба на сервис (handoff, не routing)"
        examples:
          - "Ужасная клиника"
          - "Спасибо, всё отлично"
          - "Хочу пожаловаться на врача"
          - "Долго ждал в очереди"
          - "Рекомендую вашу клинику"

# Пороги уверенности для каскадной маршрутизации
confidence_thresholds:
  high: 0.90
  medium: 0.70
  low: 0.50

# Правила приоритета (из production router.py settings.py domain_priority)
routing_rules:
  domain_priority: ["anamnesis", "faq", "booking"]
  mixed_intent_rule: "При смешанном интенте (жалоба + вопрос) → anamnesis"
  greeting_with_intent_rule: "Приветствие + интент → по интенту (НЕ unsupported)"
  doctor_surname_rule: "Упоминание фамилии врача → faq (для verification)"
  urgent_rule: "Признаки ургентности → anamnesis + urgency=urgent"
