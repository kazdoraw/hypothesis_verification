# D4v2 Experiment Configuration
# FAQ Architecture Experiment for AI DENTIST

experiment:
  name: "D4v2_faq_architecture_experiment"
  version: 2
  seed: 42
  description: >
    Контролируемый эксперимент: 4 стратегии предоставления знаний LLM (S1-S4)
    + 1 production baseline (B0) для выбора минимально достаточной архитектуры
    FAQ-модуля стоматологической клиники.

# LLM configuration (единый для S1-S4)
llm:
  provider: "openrouter"
  api_url: "https://openrouter.ai/api/v1"
  model: "Qwen/Qwen3-Next-80B-A3B-Instruct"
  temperature: 0.1
  top_p: 1.0
  max_tokens: 1024

# Judge LLM (вторичный слой оценки, не единственный источник)
judge:
  provider: "openrouter"
  api_url: "https://openrouter.ai/api/v1"
  model: "openai/gpt-5.4-mini"
  temperature: 0.0
  max_tokens: 1024

# Embedding configuration (для S3 Vector и S4 Hybrid)
embedding:
  model: "BAAI/bge-m3"
  device: "mps"  # Apple Silicon; change to "cuda" or "cpu"
  similarity_method: "cosine"
  top_k: 5

# Стратегии (4 сценария + 1 baseline)
strategies:
  - id: "S1"
    name: "Full Context"
    description: "Вся KB целиком в prompt, детерминированная сериализация"
    uses_llm: true
    uses_embedding: false
    uses_lexical: false

  - id: "S2"
    name: "Lexical Retrieval"
    description: "Keyword/BM25/FTS → top-k retrieval units"
    uses_llm: true
    uses_embedding: false
    uses_lexical: true

  - id: "S3"
    name: "Vector Retrieval"
    description: "Embedding similarity → top-k, без lexical rerank"
    uses_llm: true
    uses_embedding: true
    uses_lexical: false

  - id: "S4"
    name: "Hybrid Retrieval"
    description: "Lexical + Vector (RRF), без agentic RAG"
    uses_llm: true
    uses_embedding: true
    uses_lexical: true

  - id: "B0"
    name: "Keyword + Template"
    description: "Production baseline без LLM, вне inferential block"
    uses_llm: false
    uses_embedding: false
    uses_lexical: true

# Eval set configuration
eval_set:
  target_size: 150
  min_size: 120
  max_size: 180
  manual_ratio_min: 0.30  # ≥ 30-40% ручных/real-like
  min_per_category: 10
  deduplication_threshold: 0.85  # cosine similarity
  required_classes:
    - "doctor"
    - "specialization"
    - "complaint"
    - "service"
    - "address"
    - "schedule"
    - "sedation"
    - "children"
    - "payment"
    - "documents"
    - "mixed_conversational"
    - "unanswerable"

# KB data
kb:
  sources:
    - "data/kb/clinic_info.yaml"
    - "data/kb/doctors.yaml"
    - "data/kb/dentklever_prices.csv"
  chunking:
    method: "logical"  # не token-based
    expected_units: [45, 60]

# KB scale experiment (отдельная опциональная фаза)
kb_scale:
  enabled: false  # включить после core experiment
  method: "nested_distractor_expansion"
  sizes_tokens: [5000, 15000, 30000, 50000]
  labels: ["5K", "15K", "30K", "50K"]
  strategies: ["S1", "S3", "S4"]  # S2 не масштабируется

# Statistical analysis
statistics:
  primary_endpoint: "factual_accuracy"
  secondary_endpoint: "unsupported_claim_rate"
  bootstrap_n_resamples: 10000
  confidence_level: 0.95
  significance_alpha: 0.05
  multiple_comparison_correction: "holm"  # или "benjamini-hochberg"
  paired_comparisons:
    - ["S1", "S2"]
    - ["S1", "S3"]
    - ["S1", "S4"]
    - ["S2", "S4"]
    - ["S3", "S4"]

# Evaluation layers
evaluation:
  manual_validation_min: 30
  manual_validation_max: 50
  judge_correlation_subset: 30  # для корреляции judge vs expert

# Rate limiting & parallelism
rate_limit:
  max_workers: 8              # параллельных потоков для LLM вызовов
  request_timeout_sec: 90     # таймаут на один LLM вызов
  max_retries: 3
  checkpoint_every_n: 25
