# Таксономия FAQ-запросов пациентов стоматологической клиники
# D4v2: Knowledge Access Benchmark
#
# 2-уровневая иерархия: category → subtypes
# Связь запрос↔чанк определяется при annotation (gold_facts / gold_chunk_ids),
# НЕ в таксономии (устранение Bias 1: циркулярная gold_map).

taxonomy:

  # ===== ИНФОРМАЦИЯ О КЛИНИКЕ =====
  clinic_info:
    description: "Фактоидные запросы о клинике (адрес, график, контакты, услуги)"
    answerable: true
    subtypes:
      address_location:
        description: "Где находится клиника"
        examples: ["Где вы находитесь?", "Подскажите адрес", "Как до вас добраться?", "Адрес клиники скиньте"]
        n_queries: 8

      working_hours:
        description: "Часы работы, расписание"
        examples: ["До скольки работаете?", "Вы по выходным принимаете?", "В субботу работаете?", "Во сколько открываетесь?"]
        n_queries: 8

      phone_contact:
        description: "Телефон, email, способы связи"
        examples: ["Какой телефон?", "Как позвонить?", "Номер для записи скиньте"]
        n_queries: 6

      sedation_options:
        description: "Седация, лечение во сне, закись азота"
        examples: ["Можно под наркозом?", "Боюсь стоматологов", "Лечите под седацией?"]
        n_queries: 6

      financing:
        description: "Рассрочка, способы оплаты"
        examples: ["Есть рассрочка?", "Можно в кредит?", "Оплата частями есть?"]
        n_queries: 5

      children_accepted:
        description: "Приём детей"
        examples: ["Принимаете детей?", "С какого возраста?", "Ребёнку 3 года, примете?"]
        n_queries: 4

      licenses_documents:
        description: "Лицензии, документы, сертификаты"
        examples: ["Есть лицензия?", "Какие документы нужны?", "Что с собой брать на приём?"]
        n_queries: 4

  # ===== ИНФОРМАЦИЯ О ВРАЧАХ =====
  doctor_info:
    description: "Поиск врача по имени или специализации"
    answerable: true
    subtypes:
      by_surname:
        description: "Поиск по фамилии (именительный, вопросительный)"
        examples:
          - "Ермаков у вас работает?"
          - "Есть доктор Батылин?"
          - "Молгачева у вас принимает?"
          - "Кто такой Булатов?"
          - "Какой опыт у Ермакова?"
        n_queries: 10

      by_specialization:
        description: "Список врачей определённой специализации"
        examples: ["Кто у вас ортодонт?", "Есть хирурги?", "Какие ортопеды есть?", "Список детских стоматологов"]
        n_queries: 6

      experience_query:
        description: "Вопросы о стаже и опыте конкретного врача"
        examples: ["Какой стаж у Филькина?", "Кто такая Сотникова?", "Сколько лет опыта у хирурга?"]
        n_queries: 5

  # ===== ЦЕНЫ НА УСЛУГИ =====
  pricing:
    description: "Запросы о стоимости услуг клиники"
    answerable: true
    subtypes:
      specific_service:
        description: "Цена конкретной услуги"
        examples: ["Сколько стоит имплант?", "Цена удаления зуба мудрости", "Почём удаление?", "Стоимость виниров"]
        n_queries: 8

      category_overview:
        description: "Обзор цен по направлению"
        examples: ["Сколько стоят брекеты?", "Прайс на протезирование", "Цены на детскую стоматологию"]
        n_queries: 6

      price_comparison:
        description: "Сравнение цен между услугами"
        examples: ["Что дешевле — металлокерамика или цирконий?", "Импланты или протезы что дешевле?", "Керамические брекеты дороже металлических?"]
        n_queries: 4

  # ===== РЕКОМЕНДАЦИИ ПОСЛЕ ЛЕЧЕНИЯ =====
  aftercare:
    description: "Вопросы по уходу и ограничениям после процедур"
    answerable: true
    subtypes:
      post_surgery:
        description: "После хирургического вмешательства (удаление, имплантация)"
        examples: ["Что нельзя после удаления?", "Когда можно есть после операции?", "Что делать если кровит после удаления?"]
        n_queries: 6

      post_prosthetics:
        description: "Уход за протезами (съёмными и несъёмными)"
        examples: ["Как ухаживать за протезом?", "Чем чистить коронку?", "Может ли протез натирать?"]
        n_queries: 5

      post_orthodontics:
        description: "Уход при ортодонтическом лечении (брекеты)"
        examples: ["Что делать если брекет отклеился?", "Чем чистить зубы с брекетами?", "Что нельзя есть с брекетами?"]
        n_queries: 5

      alarm_symptoms:
        description: "Тревожные симптомы после любых процедур"
        examples: ["Нормально ли что отекает после имплантации?", "Сильная боль после удаления — это нормально?", "Температура после операции, что делать?"]
        n_queries: 4

  # ===== СЛОЖНЫЕ / REASONING =====
  reasoning:
    description: "Запросы, требующие объединения нескольких фактов из KB"
    answerable: true
    subtypes:
      multi_fact:
        description: "Данные из разных частей KB (врач + цена, aftercare + клиника)"
        examples: ["Кто из хирургов самый опытный и сколько стоит консультация?", "Есть ли детский стоматолог с опытом >10 лет?", "Какой терапевт с наибольшим стажем и какие у него цены?"]
        n_queries: 6

  # ===== ВНЕ ЗОНЫ ПОКРЫТИЯ =====
  out_of_scope:
    description: "Запросы, на которые нет ответа в KB"
    answerable: false
    subtypes:
      promotions:
        description: "Акции, скидки"
        examples: ["Есть акции?", "Скидка пенсионерам?", "Есть программа лояльности?"]
        n_queries: 4

      unknown_entity:
        description: "Несуществующий врач или услуга"
        examples: ["Работает ли у вас Иванов?", "Делаете ли вы лазерную хирургию?", "У вас есть врач-офтальмолог?"]
        n_queries: 4

      wrong_domain:
        description: "Вопросы не по теме стоматологии"
        examples: ["Где ближайшая аптека?", "Какая погода?", "А вы зрение проверяете?"]
        n_queries: 4

      missing_info:
        description: "Запрос о данных, которых нет в KB (ОМС, бесплатные услуги, страховки)"
        examples: ["Можно по полису ОМС?", "Рентген бесплатно делают?", "Есть ДМС?"]
        n_queries: 3

# Стили генерации запросов (для вариативности)
query_styles:
  - id: "formal"
    description: "Формальный, грамотный вопрос"
    weight: 0.2

  - id: "casual"
    description: "Разговорный стиль, как в Telegram"
    weight: 0.3

  - id: "typo"
    description: "С опечатками и ошибками"
    weight: 0.2

  - id: "incomplete"
    description: "Неполное предложение, без знаков препинания"
    weight: 0.15

  - id: "indirect"
    description: "Косвенный вопрос, не прямой"
    weight: 0.15
